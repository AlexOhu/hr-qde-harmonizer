
services:
  neo4j-walkthrough:
    image: neo4j:5.26-community
    container_name: hrqde-neo4j-walkthrough
    ports:
      - "7475:7474"   # Browser-UI, verschoben, damit der Hauptcontainer weiterlaufen kann
      - "7688:7687"   # Bolt-Protokoll, verschoben
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_WALKTHROUGH_PASSWORD:-changeme123}"
      NEO4J_PLUGINS: '["n10s"]'
      NEO4J_dbms_security_procedures_unrestricted: "n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "n10s.*"
    volumes:
      - neo4j_walkthrough_data:/data
      - neo4j_walkthrough_import:/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_WALKTHROUGH_PASSWORD:-changeme123}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_walkthrough_data:
  neo4j_walkthrough_import:
